# Theming
font: JetBrainsMono Nerd Font 14
background: "#282828d0"
color: "#d8dee9ff"
border: "#5e81acff"
separator: " ➜ "
border_width: 2
corner_r: 10
padding: 15 # Defaults to corner_r
rows_per_column: 25 # No limit by default
column_padding: 25 # Defaults to padding

# Anchor and margin
anchor: bottom-right # One of center, left, right, top, bottom, bottom-left, top-left, etc.
# Only relevant when anchor is not center
margin_right: 40
margin_bottom: 40
margin_left: 0
margin_top: 0

# namespace to use for the layer shell surface
# namespace: "wlr_which_key"

# Permits key bindings that conflict with compositor key bindings.
# Default is `false`.
inhibit_compositor_keyboard_shortcuts: true

# Try to guess the correct keyboard layout to use. Default is `false`.
auto_kbd_layout: true

menu:
  - key: "p"
    desc: Power
    cmd: noctalia msg panel-open session
  - key: "r"
    desc: "Reload"
    submenu:
      - key: "s"
        desc: "Shell (Noctalia)"
        cmd: noctalia msg config-reload
  - key: "c"
    desc: "Configurations"
    submenu:
      - key: "n"
        desc: " Noctalia"
        cmd: noctalia msg settings-open
      - key: "k"
        desc: " KDE and QT applications"
        cmd: gio launch /usr/share/applications/kdesystemsettings.desktop
      - key: "g"
        desc: " Gnome and libadwatta applications"
        cmd: gio launch /usr/share/applications/nwg-look.desktop
      - key: "u"
        desc: " Other configurations"
        cmd: ghostty -e nvim ~/configurations/dotfiles
      - key: "s"
        desc: " System configurations"
        cmd: ghostty -e nvim ~/configurations/systems
  - key: "a"
    desc: "Applications"
    submenu:
      - key: "t"
        desc: " Terminal (Ghostty)"
        cmd: ~/.config/dot-bin/local/niri_helper.py launch_single com.mitchellh.ghostty
      - key: "b"
        desc: "󰖟 Browzer (Zen Browser)"
        cmd: ~/.config/dot-bin/local/niri_helper.py launch_single zen
      - key: "m"
        desc: "󰺻 Mail client (Thunderbird)"
        cmd: ~/.config/dot-bin/local/niri_helper.py launch_single org.mozilla.Thunderbird
      - key: "p"
        desc: "󰥠 Player (Elisa)"
        cmd: ~/.config/dot-bin/local/niri_helper.py launch_single org.kde.elisa
      - key: "s"
        desc: " Steam"
        cmd: ~/.config/dot-bin/local/niri_helper.py launch_single steam
      - key: " "
        desc: "󰮫 Picker (Noctalia Launcher)"
        cmd: noctalia msg panel-open launcher
